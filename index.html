<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo to TV Video</title><style>body{font-family:system-ui;background:#101827;color:#f3f6fc;padding:28px}main{max-width:750px;margin:auto}section{background:#1c2940;padding:22px;border-radius:15px}button{padding:12px;background:#4d9aff;border:0;border-radius:8px}button:disabled{opacity:.5}canvas{width:100%;aspect-ratio:16/9;background:black;margin:18px 0}#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a8d0ff}</style></head><body><main><h1>Photo to TV Video</h1><p>MP4 · H.264 · 1920 × 1080 · 25 fps · 6 δευτερόλεπτα</p><section><label>Επιλογή φωτογραφίας JPG/PNG <input id="photo" type="file" accept="image/jpeg,image/png"></label><canvas id="preview" width="1920" height="1080"></canvas><button id="convert" disabled>Μετατροπή σε MP4</button><p id="status">Διάλεξε φωτογραφία.</p><p id="download"></p></section></main><script>
const photo=document.querySelector('#photo'),canvas=document.querySelector('#preview'),ctx=canvas.getContext('2d'),button=document.querySelector('#convert'),status=document.querySelector('#status'),download=document.querySelector('#download');
let selected=false,link=null;
function draw(img){const W=1920,H=1080;ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);const cover=Math.max(W/img.width,H/img.height);ctx.save();ctx.filter='blur(42px)';ctx.drawImage(img,(W-img.width*cover)/2,(H-img.height*cover)/2,img.width*cover,img.height*cover);ctx.restore();ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);const fit=Math.min(W/img.width,H/img.height);ctx.drawImage(img,(W-img.width*fit)/2,(H-img.height*fit)/2,img.width*fit,img.height*fit)}
photo.onchange=()=>{selected=false;button.disabled=true;download.textContent='';const file=photo.files[0];if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)){status.textContent='Επίλεξε JPG ή PNG.';return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{draw(img);selected=true;button.disabled=false;status.textContent='Η προεπισκόπηση είναι έτοιμη.';URL.revokeObjectURL(url)};img.onerror=()=>{status.textContent='Δεν διαβάστηκε η φωτογραφία.';URL.revokeObjectURL(url)};img.src=url};
function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(Error('Αποτυχία φόρτωσης '+src));document.head.appendChild(s)})}
button.onclick=async()=>{if(!selected)return;button.disabled=true;download.textContent='';let ff;try{if(location.protocol!=='https:'&&location.hostname!=='localhost')throw Error('Άνοιξε την ιστοσελίδα μέσω HTTPS.');status.textContent='Φόρτωση FFmpeg…';if(!window.FFmpegWASM)await loadScript('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js');if(!window.FFmpegUtil)await loadScript('https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js');const {FFmpeg}=window.FFmpegWASM,{toBlobURL}=window.FFmpegUtil;ff=new FFmpeg();ff.on('log',({message})=>{if(message.includes('frame='))status.textContent='Κωδικοποίηση: '+message.slice(0,110)});const coreBase='https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';await ff.load({coreURL:await toBlobURL(coreBase+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(coreBase+'/ffmpeg-core.wasm','application/wasm')});status.textContent='Δημιουργία MP4…';const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Αποτυχία εικόνας')),'image/png'));await ff.writeFile('frame.png',new Uint8Array(await blob.arrayBuffer()));const code=await ff.exec(['-loop','1','-framerate','25','-i','frame.png','-frames:v','150','-c:v','libx264','-pix_fmt','yuv420p','-r','25','-movflags','+faststart','output.mp4']);if(code!==0)throw Error('FFmpeg exit '+code);const data=await ff.readFile('output.mp4');if(!data.length)throw Error('Κενό MP4');if(link)URL.revokeObjectURL(link);link=URL.createObjectURL(new Blob([data],{type:'video/mp4'}));const a=document.createElement('a');a.href=link;a.download='photo_to_tv_1080p_25fps_6s.mp4';a.textContent='Κατέβασε το MP4';download.append(a);status.textContent='Ολοκληρώθηκε. Έλεγξε το MP4 πριν από τηλεοπτική χρήση.'}catch(e){console.error(e);status.textContent='Σφάλμα: '+e.message+'\nΑν αποτύχει ξανά, στείλε το πλήρες μήνυμα.'}finally{if(ff)try{ff.terminate()}catch{}button.disabled=false}};
</script></body></html>
