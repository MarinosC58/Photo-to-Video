<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Μαρίνος Photo to Video Site</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#f3f6fc;margin:0;padding:28px}
main{max-width:750px;margin:auto}h1{font-size:28px}p{color:#c8d2e3}
section{background:#1c2940;padding:22px;border-radius:15px}
button,input{font:inherit}button{background:#4d9aff;color:#081322;border:0;padding:12px 18px;border-radius:9px;cursor:pointer;font-weight:700}
button:disabled{opacity:.5;cursor:wait}canvas{display:block;width:100%;aspect-ratio:16/9;background:#000;margin:18px 0;border-radius:8px}
#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a8d0ff}small{color:#bac8dc}
#slides{display:flex;flex-direction:column;gap:7px;margin:12px 0}#slides button{padding:5px 10px;font-size:13px}#slides .slide{display:flex;align-items:center;gap:10px;background:#263650;border-radius:7px;padding:7px}#slides .name{flex:1;overflow-wrap:anywhere}#slides .controls{display:flex;gap:5px}#slides .active{outline:2px solid #4d9aff}
</style>
</head>
<body><main><h1>Μαρίνος Photo to TV Video</h1>
<p>MP4 · 1920 × 1080 · 25 fps </p>
<section><label for="photo"> Δκιάλεξε JPG / PNG </label>
<p><input id="photo" type="file" accept="image/jpeg,image/png" multiple></p>
<div id="slides"></div>
<canvas id="preview" width="1920" height="1080"></canvas>
<button id="convert" disabled> Convert to MP4</button>
<p id="status" role="status"> Δκιάλεξε εικόνες.</p><p id="download"></p>
<small> Κάθε φωτογραφία εμφανίζεται για 6 δευτερόλεπτα. Αλλάσεις τη σειρά με τα βελούθκια αν θέλεις.</small>
</section></main>
<script>
const photo=document.getElementById('photo'),canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),button=document.getElementById('convert'),status=document.getElementById('status'),download=document.getElementById('download'),slides=document.getElementById('slides');
let images=[],link=null,busy=false;
function draw(img){const W=1920,H=1080;ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);const cover=Math.max(W/img.width,H/img.height);ctx.save();ctx.filter='blur(42px)';ctx.drawImage(img,(W-img.width*cover)/2,(H-img.height*cover)/2,img.width*cover,img.height*cover);ctx.restore();ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);const fit=Math.min(W/img.width,H/img.height);ctx.drawImage(img,(W-img.width*fit)/2,(H-img.height*fit)/2,img.width*fit,img.height*fit)}
function renderList(){slides.replaceChildren();images.forEach((item,i)=>{const row=document.createElement('div');row.className='slide';const name=document.createElement('span');name.className='name';name.textContent=(i+1)+'. '+item.name+' (6 δευτ.)';name.onclick=()=>{document.querySelectorAll('.slide').forEach(x=>x.classList.remove('active'));row.classList.add('active');draw(item.img)};name.style.cursor='pointer';const controls=document.createElement('span');controls.className='controls';for(const [label,delta] of [['↑',-1],['↓',1]]){const b=document.createElement('button');b.textContent=label;b.title=delta<0?'Πιο πάνω':'Πιο κάτω';b.disabled=busy||(i+delta<0)||(i+delta>=images.length);b.onclick=()=>{[images[i],images[i+delta]]=[images[i+delta],images[i]];renderList()};controls.appendChild(b)}row.append(name,controls);slides.appendChild(row)});if(images.length){draw(images[0].img);slides.firstChild.classList.add('active')}button.disabled=busy||!images.length}
photo.onchange=async()=>{if(busy)return;images=[];button.disabled=true;download.replaceChildren();slides.replaceChildren();const files=Array.from(photo.files);if(!files.length){status.textContent='Διάλεξε φωτογραφίες.';return}status.textContent='Ανάγνωση φωτογραφιών…';for(const file of files){if(!['image/jpeg','image/png'].includes(file.type)){status.textContent='Μη υποστηριζόμενο αρχείο: '+file.name;continue}try{const img=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Αδυναμία ανάγνωσης'))};image.src=url});images.push({name:file.name,img})}catch(e){console.error(file.name,e)}}renderList();status.textContent=images.length+' φωτογραφίες · '+(images.length*6)+' δευτερόλεπτα συνολικά.'};
function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(Error('Αποτυχία φόρτωσης '+src));document.head.appendChild(s)})}
function canvasPNG(){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Αποτυχία εικόνας')),'image/png'))}
button.onclick=async()=>{if(!images.length||busy)return;busy=true;button.disabled=true;photo.disabled=true;renderList();download.replaceChildren();let ff;try{
if(location.protocol!=='https:'&&location.hostname!=='localhost')throw Error('Άνοιξε την ιστοσελίδα μέσω HTTPS.');
status.textContent='Φόρτωση FFmpeg…';
if(!window.FFmpegWASM)await loadScript('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js');
if(!window.FFmpegUtil)await loadScript('https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js');
const {FFmpeg}=window.FFmpegWASM,{toBlobURL}=window.FFmpegUtil;
ff=new FFmpeg();
ff.on('log',({message})=>{if(message.includes('frame='))status.textContent='Κωδικοποίηση: '+message.slice(0,110)});
const coreBase='https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
await ff.load({
classWorkerURL:new URL('./ffmpeg-worker.js',document.baseURI).href,
coreURL:await toBlobURL(coreBase+'/ffmpeg-core.js','text/javascript'),
wasmURL:await toBlobURL(coreBase+'/ffmpeg-core.wasm','application/wasm')
});
// Δημιουργούμε στατικές εικόνες Full HD και αρχείο concat με διάρκεια 6 δευτ. ανά εικόνα.
let manifest='ffconcat version 1.0\n';
for(let i=0;i<images.length;i++){
status.textContent='Preparing '+(i+1)+'/'+images.length+'…';
draw(images[i].img);
const blob=await canvasPNG(),filename='slide'+String(i).padStart(5,'0')+'.png';
await ff.writeFile(filename,new Uint8Array(await blob.arrayBuffer()));
manifest+='file '+filename+'\nduration 6\n';
}
// Επαναλαμβάνουμε το τελευταίο αρχείο ώστε να έχει και αυτό πλήρη διάρκεια.
manifest+='file slide'+String(images.length-1).padStart(5,'0')+'.png\n';
await ff.writeFile('slides.ffcat',new TextEncoder().encode(manifest));
status.textContent='Βάσταξε λλίο…';
const totalFrames=images.length*150;
const code=await ff.exec(['-f','concat','-safe','0','-i','slides.ffcat','-vf','fps=25','-frames:v',String(totalFrames),'-c:v','libx264','-pix_fmt','yuv420p','-r','25','-movflags','+faststart','output.mp4']);
if(code!==0)throw Error('FFmpeg exit '+code);
const data=await ff.readFile('output.mp4');if(!data.length)throw Error('Κενό MP4');
if(link)URL.revokeObjectURL(link);
link=URL.createObjectURL(new Blob([data],{type:'video/mp4'}));
const a=document.createElement('a');a.href=link;a.download='photo_to_tv_1080p_25fps_'+(images.length*6)+'s.mp4';a.textContent='Κατέβασε το MP4';download.replaceChildren(a);
status.textContent='Ολοκληρώθηκε: '+images.length+' φωτογραφίες, '+(images.length*6)+' δευτερόλεπτα. Έλεγξε το MP4 πριν από χρήση.';
}catch(e){console.error(e);status.textContent='Σφάλμα: '+e.message+'\nΣτείλε το πλήρες μήνυμα.'}
finally{if(ff)try{ff.terminate()}catch{}busy=false;photo.disabled=false;renderList()}
};
</script></body></html>
